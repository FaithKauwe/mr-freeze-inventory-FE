<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Freeze Home</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom Styles -->
  <link href="assets/css/styles.css" rel="stylesheet">

</head>
<body>
  
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">MR FREEZE</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="inventory.html">Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="add_item.html">Add Item</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="expend_item.html">Expend Item</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content">
    <div class="container mt-5">
      <div class="custom-cards-container">
          <!-- Card 1 -->
          <a href="inventory.html" class="custom-card">
            <div class="card-icon">
                <img src="assets/images/freezer-inventory-icon.svg" alt="Clipboard icon representing inventory management">
            </div>
            <div class="card-content">
                <h2>Current Inventory</h2>
                <p>See whats in the freezer!</p>
                <span class="btn btn-primary">View Inventory</span>
            </div>
          </a>
          
          <!-- Card 2 -->
          <a href="add_item.html" class="custom-card">
            <div class="card-icon">
                <img src="assets/images/grocery-bag-icon.png" alt="Shopping bag icon representing adding new items after grocery shopping">
            </div>
            <div class="card-content">
                <h2>Add Item</h2>
                <p>Bought something?</p>
                <span class="btn btn-primary">Add New Item</span>
            </div>
          </a>
          
          <!-- Card 3 -->
          <a href="expend_item.html" class="custom-card frying-pan-card">
            <div class="card-icon">
                <img src="assets/images/frying-pan-icon.png" alt="Frying pan icon representing cooking and using items from the freezer">
            </div>
            <div class="card-content">
                <h2>Use Item</h2>
                <p>Time to cook?</p>
                <span class="btn btn-primary">Use Item</span>
            </div>
          </a>
      </div>
  </div>
  </main>


  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2024 Kiowa Labs. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS and Popper.js (for responsive navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
