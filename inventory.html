<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Freeze Inventory</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
  
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">MR FREEZE</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="inventory.html">Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="add_item.html">Add Item</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="expend_item.html">Expend Item</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content">
    <div class="container my-5">
      <h1>Current Inventory</h1>
      <p class="lead">Select a category to view items in your freezer</p>
      
      <div class="form-group mb-4">
        <label for="categoryDropdown" class="form-label">Choose a category:</label>
        <select class="form-control" id="categoryDropdown">
            <option value="">Select a category</option>
            <option value="meats">Meats</option>
            <option value="seafood">Seafood</option>
            <option value="frozen-meals">Frozen Meals</option>
            <option value="vegetables">Vegetables</option>
            <option value="other">Other</option>
        </select>
      </div>

      <div id="inventoryResults" class="mt-4">
        <!-- Results will be displayed here -->
      </div>
    </div>
  </main>

  <script>
    // Inventory data
    const inventoryData = {
      meats: [
        { name: "Boneless, skinless chicken thighs", amount: "2 lbs", date: "2024-01-15" },
        { name: "Ground beef (80/20)", amount: "1.5 lbs", date: "2024-01-10" },
        { name: "Pork chops", amount: "6 pieces", date: "2024-01-12" },
        { name: "Beef stew meat", amount: "1 lb", date: "2024-01-08" }
      ],
      seafood: [
        { name: "Salmon fillets", amount: "4 pieces", date: "2024-01-14" },
        { name: "Shrimp (large)", amount: "1 lb", date: "2024-01-11" },
        { name: "Cod fillets", amount: "2 lbs", date: "2024-01-09" },
        { name: "Scallops", amount: "0.5 lbs", date: "2024-01-13" }
      ],
      "frozen-meals": [
        { name: "Pork + shrimp dumplings", amount: "1 bag", date: "2024-01-16" },
        { name: "Chicken pot pie", amount: "2 pieces", date: "2024-01-07" },
        { name: "Beef lasagna", amount: "1 tray", date: "2024-01-05" },
        { name: "Vegetable stir fry mix", amount: "1 bag", date: "2024-01-12" }
      ],
      vegetables: [
        { name: "Mixed vegetables", amount: "2 bags", date: "2024-01-06" },
        { name: "Broccoli florets", amount: "1 bag", date: "2024-01-11" },
        { name: "Green beans", amount: "1 bag", date: "2024-01-08" },
        { name: "Corn kernels", amount: "3 bags", date: "2024-01-04" }
      ],
      other: [
        { name: "Ice cream (vanilla)", amount: "1 quart", date: "2024-01-17" },
        { name: "Frozen berries", amount: "2 bags", date: "2024-01-10" },
        { name: "Bread dough", amount: "1 loaf", date: "2024-01-14" }
      ]
    };

    // Function to display inventory items
    function displayInventory(category) {
      const resultsDiv = document.getElementById('inventoryResults');
      
      if (!category || !inventoryData[category]) {
        resultsDiv.innerHTML = '<p class="text-muted">Please select a category to view items.</p>';
        return;
      }

      const items = inventoryData[category];
      const categoryName = category.charAt(0).toUpperCase() + category.slice(1).replace('-', ' ');
      
      let html = `<h3>${categoryName} (${items.length} items)</h3>`;
      html += '<div class="list-group">';
      
      items.forEach(item => {
        html += `
          <div class="list-group-item">
            <div class="d-flex w-100 justify-content-between">
              <h5 class="mb-1">${item.name}</h5>
              <small>${item.date}</small>
            </div>
            <p class="mb-1">Amount: ${item.amount}</p>
          </div>
        `;
      });
      
      html += '</div>';
      resultsDiv.innerHTML = html;
    }

    // Event listener for dropdown change
    document.getElementById('categoryDropdown').addEventListener('change', function() {
      displayInventory(this.value);
    });
  </script>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2024 Kiowa Labs. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS and Popper.js (for responsive navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
