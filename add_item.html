<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mr Freeze Inventory</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
        padding-top: 60px;
    }
  </style>
</head>
<body>
  
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">MR FREEZE</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="inventory.html">Inventory</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="add_item.html">Add Item</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="expend_item.html">Expend Item</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="main-content">
    <div class="container mt-5">
      <h1>Add An Item</h1>
      <p class="lead">Add your sticker to the item and scan the QR code with your phone camera</p>

      <!-- QR Code Section -->
      <div class="row mb-4">
        <div class="col-12 text-center">
          <div class="card">
            <div class="card-body">
              <div class="mb-3">
                <!-- Placeholder for QR code scanner -->
                <div class="bg-light border rounded p-5 mb-3">
                  <i class="fas fa-qrcode fa-3x text-muted"></i>
                  <p class="text-muted mt-2">QR Code Scanner</p>
                </div>
              </div>
              <p class="text-muted">Add your sticker to the item</p>
              <p class="text-muted">Scan the QR code with your phone camera</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Section -->
      <div class="card">
        <div class="card-body">
          <h2>Item Details</h2>
          <form id="userForm">
              <div class="mb-3">
                  <label for="category" class="form-label">Category</label>
                  <select class="form-control" id="category" required>
                      <option value="">Select food category</option>
                      <option value="meats">Meats</option>
                      <option value="seafood">Seafood</option>
                      <option value="frozen-meals">Frozen Meals</option>
                      <option value="vegetables">Vegetables</option>
                      <option value="other">Other</option>
                  </select>
              </div>

              <div class="mb-3">
                  <label for="itemName" class="form-label">Item Name</label>
                  <input type="text" class="form-control" id="itemName" placeholder="chicken thighs, gumbo, broccoli, etc" required>
              </div>

              <div class="mb-3">
                  <label for="weight" class="form-label">Weight/Amount</label>
                  <input type="text" class="form-control" id="weight" placeholder="Enter weight or amount" required>
              </div>

              <div class="mb-3">
                  <label for="date" class="form-label">Date</label>
                  <input type="date" class="form-control" id="date" required>
              </div>

              <button type="submit" class="btn btn-primary btn-lg">Submit</button>
          </form>
        </div>
      </div>

      <!-- Feedback Message -->
      <div id="feedbackMessage" class="mt-3"></div>
    </div>
  </main>

<script>
    // JavaScript to handle form submission and display feedback
    document.getElementById('userForm').addEventListener('submit', function(event) {
        event.preventDefault();  // Prevent default form submission behavior

        // Get form field values
        var category = document.getElementById('category').value;
        var itemName = document.getElementById('itemName').value;
        var date = document.getElementById('date').value;
        var weight = document.getElementById('weight').value;

        // Display feedback message
        var feedbackMessage = `
            <h4>Form Submitted Successfully!</h4>
            <p><strong>Category:</strong> ${category}</p>
            <p><strong>Item Name:</strong> ${itemName}</p>
            <p><strong>Date:</strong> ${date}</p>
            <p><strong>Weight/Amount:</strong> ${weight}</p>
        `;

        document.getElementById('feedbackMessage').innerHTML = feedbackMessage;

        // Clear form fields
        document.getElementById('userForm').reset();
    });
</script>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2024 Kiowa Labs. All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS and Popper.js (for responsive navbar toggle) -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

</body>
</html>
